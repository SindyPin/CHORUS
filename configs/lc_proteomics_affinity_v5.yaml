# Version 5 (17 November 2026): configs/lc_proteomics_affinity_v4.yaml plus Woodruff2023 (Olink Explore 3072) and
# Bansal2025 (Olink Target 96 Inflammation and Neurology; 56 participants, vendor QC rule as built). The proteins shared by
# all six cohorts (55; Bansal2025 measures 182). Woodruff2023 ICU acute samples are dropped by sample_phase, the
# Bansal2025 healthy participants by lc_status. Reduced grid of the version 5 rerun.
layer: proteomics
cohorts:
  - {study_id: Buggert2025,         matrix: data/proteomics/Buggert2025/Buggert2025_matrix.csv,                 meta: data/meta/Buggert2025_meta.csv,         feature_space: uniprot, accession: "doi:10.5281/zenodo.14772494"}
  - {study_id: Cervia2024_SomaScan, matrix: data/proteomics/Cervia2024_SomaScan/Cervia2024_SomaScan_matrix.csv, meta: data/meta/Cervia2024_SomaScan_meta.csv, feature_space: uniprot, accession: "doi:10.17632/dvf6yvrg4x.1"}
  - {study_id: Su2022,              matrix: data/proteomics/Su2022/Su2022_matrix.csv,                           meta: data/meta/Su2022_meta.csv,              feature_space: uniprot, accession: "doi:10.17632/96v329bg7g.1"}
  - {study_id: Fineschi2026,        matrix: data/proteomics/Fineschi2026/Fineschi2026_matrix.csv,               meta: data/meta/Fineschi2026_meta.csv,        feature_space: uniprot, accession: "doi:10.17044/scilifelab.31316779"}
  - {study_id: Woodruff2023,        matrix: data/proteomics/Woodruff2023/Woodruff2023_matrix.csv,               meta: data/meta/Woodruff2023_meta.csv,        feature_space: uniprot, accession: "doi:10.5281/zenodo.8092298"}
  - {study_id: Bansal2025,          matrix: data/proteomics/Bansal2025/Bansal2025_matrix.csv,                   meta: data/meta/Bansal2025_meta.csv,          feature_space: uniprot, accession: "doi:10.5281/zenodo.15237087"}
preprocessing:
  matrices: [plasma, serum]
  drop_sample_phases: [acute]               # acute draws carry the later outcome in lc_status; Test 1 uses post acute samples only
  keep_lc_status: [LC, COVID_recovered]
  one_sample_per_subject: true
  acute_timepoints: []                      # acute samples are already dropped by sample_phase
  timepoint_order: [T1, T2, T3]
  deduplicate: true
  impute: study_median                      # Olink values masked at QC (Buggert2025, 1.3% of values); per cohort, label free
benchmark:
  positive: LC
  negative: COVID_recovered
  harmonisers: [identity, center_scale, rank, fsqn, combat_addon, chorus, chorus_protected]
  nested_candidates: [identity, center_scale, rank, fsqn, combat_addon, chorus]   # chorus_protected is a comparison variant, not a nested candidate
  selectors:
    - {name: variance, k: 100}
    - {name: differential, k: 50}
    - {name: invariant, k: 50}
  classifiers: [logreg, rf]
  covariates: []
  nested_select_harmoniser: true
  min_test_per_class: 5
  n_boot: 1000
  random_state: 0
out: results/lc_proteomics_affinity_v5
