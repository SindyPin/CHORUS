# CHORUS early detection, reference (scripts/early_detection.py reference): GSE215865 (Thompson 2023, Mount Sinai), whole
# blood drawn during the acute hospital stay, the later outcome LC versus COVID_recovered (labels as in
# configs/lc_acute_transfer.yaml). One library per subject, the earliest, kept only when it is the timepoint 0 library.
# Within cohort repeated stratified 5 fold CV with the selectors and classifiers of the horizontal analysis.
layer: bulk_rna
cohorts:
  - {study_id: GSE215865, matrix: data/counts/GSE215865/GSE215865_rnaseq_raw_count_matrix.csv.gz, meta: data/meta/GSE215865_meta.csv, is_counts: true, provenance: author_matrix, accession: GSE215865}
preprocessing:
  matrices: [whole_blood]
  min_cpm: 1.0
  min_fraction_samples: 0.5
  keep_lc_status: [LC, COVID_recovered]
  one_sample_per_subject: true
  acute_timepoints: []
  keep_timepoints: [0]
  deduplicate: true
benchmark:
  positive: LC
  negative: COVID_recovered
  selectors:
    - {name: differential, k: 200}  # the invariant selector is not run: within one cohort it falls back to differential
  classifiers: [logreg, rf]
  covariates: []
  random_state: 0
out: results/early_detection/reference
