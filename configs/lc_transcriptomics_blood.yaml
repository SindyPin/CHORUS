# CHORUS primary benchmark: Long COVID versus COVID recovered from blood bulk RNA-seq, pooled across public cohorts.
# Cohort list revised 9 November 2026 against docs/data_inventory.csv (NCBI, ENA, PRIDE queries). The earlier list from the
# collaborator catalogue contained errors: GSE275334 is a NanoString PBMC panel (15 LC / 18 healthy / 14 ME/CFS), not whole
# blood RNA-seq with paired Olink, and is removed. Whole blood alone is now too thin for leave one study out, so the primary
# analysis pools whole blood and PBMC with sample_matrix as a covariate; matrix restricted runs are sensitivity analyses.
# provenance: author_matrix = GEO supplementary counts; requantify = Salmon from SRA (only GSE224615 has no counts file).
layer: bulk_rna
cohorts:
  # ---- LC versus COVID recovered labels available (primary contrast) ----
  - {study_id: GSE226260_WB,  matrix: data/counts/GSE226260_WB_counts.tsv,  meta: data/meta/GSE226260_WB_meta.csv,  is_counts: true, accession: GSE226260}
    # Aid 2025 (Nat Immunol). Whole blood subset: 52 PASC / 51 Recovered, windows 3-6, 6-12, >12 months; labels in GEO (current long_covid_status). Anchor cohort.
  - {study_id: GSE226260_PBMC, matrix: data/counts/GSE226260_PBMC_counts.tsv, meta: data/meta/GSE226260_PBMC_meta.csv, is_counts: true, accession: GSE226260}
    # Aid 2025 PBMC subset: 72 PASC / 14 NOPASC; labels in GEO (pasc status). Same participants may appear in the WB subset: de-duplicate by subject id.
  - {study_id: GSE224615,     matrix: data/quant/GSE224615/salmon.merged.gene_counts.tsv, meta: data/meta/GSE224615_meta.csv, is_counts: true, accession: GSE224615}
    # Yin 2024 (LIINC). PBMC, 8 months, 23 LC / 13 non-LC in GEO; no count matrix, re-quantify 36 SRA runs (HiSeq 4000).
  - {study_id: GSE251849,     matrix: data/counts/GSE251849_counts.tsv,     meta: data/meta/GSE251849_meta.csv,     is_counts: true, accession: GSE251849}
    # Greene 2024. PBMC, 11 LC (6 + 5 brain fog) / 5 convalescent / 7 healthy. Small; held out only in the pooled analysis.
  - {study_id: PRJNA1184005,  matrix: data/counts/PRJNA1184005_counts.tsv,  meta: data/meta/PRJNA1184005_meta.csv,  is_counts: true, accession: PRJNA1184005}
    # Missailidis 2024. PBMC, 7 LC / 7 recovered; labels from BioSample attributes or the paper. Below the five per class threshold as a held out set; training only.
  - {study_id: GSE215865,     matrix: data/counts/GSE215865_counts.tsv,     meta: data/meta/GSE215865_meta.csv,     is_counts: true, accession: GSE215865}
    # Thompson 2023 (Mount Sinai). Whole blood, acute hospitalised, 1,392 libraries longitudinal; LC labels from the Synapse clinical table already used in TACO
    # (SindyPin/TACO Data/411_DCEG_Paths_average.csv: Subject_ID, Long_COVID). Use one sample per subject (first sample) for pooling; keep the full set for the acute transfer experiment.
  # ---- LC versus COVID recovered labels exist but are not in GEO: obtain before inclusion ----
  - {study_id: GSE267625,     matrix: data/counts/GSE267625_counts.tsv,     meta: data/meta/GSE267625_meta.csv,     is_counts: true, accession: GSE267625}
    # Blankestijn 2024 (P4O2). Whole blood, 111 libraries (79 at 3 months, 32 at 12 months). LC / recovered labels via the paper supplement or p4o2@amsterdamumc.nl. Verify counts vs normalised.
  - {study_id: GSE222253,     matrix: data/counts/GSE222253_counts.tsv,     meta: data/meta/GSE222253_meta.csv,     is_counts: true, accession: GSE222253}
    # BQC19 (PMID 37680625). Whole blood, 24 hospitalised patients, with versus without post COVID symptoms; symptom labels from the paper or BQC19. Hospitalised only.
  # ---- LC versus never infected only (secondary contrast, see sensitivity block) ----
  - {study_id: GSE270045,     matrix: data/counts/GSE270045_counts.tsv,     meta: data/meta/GSE270045_meta.csv,     is_counts: true, accession: GSE270045}
    # Shahbaz 2025. Whole blood, 19 LC (post COVID ME/CFS) / 17 healthy controls. Check infection history of controls in PMID 41205594.
  - {study_id: GSE169687,     matrix: data/counts/GSE169687_counts.tsv,     meta: data/meta/GSE169687_meta.csv,     is_counts: true, accession: GSE169687}
    # Ryan 2022. Peripheral blood, convalescents at 12/16/24 weeks by severity, 14 healthy controls; no LC field, treat convalescent as LC only if the paper defines symptoms.
  # Removed: GSE275334 (NanoString PBMC panel, no RNA-seq, no recovered controls, no Olink). GSE286325 (scRNA, raw reads not public) kept aside for a pseudobulk sensitivity analysis.
preprocessing:
  matrices: [whole_blood, PBMC]   # primary analysis pools both; rerun with [whole_blood] and with [PBMC] as sensitivity analyses
  min_cpm: 1.0
  min_fraction_samples: 0.5
  deduplicate: true
benchmark:
  positive: LC
  negative: COVID_recovered        # secondary run: negative: never_infected, adding GSE270045 and GSE169687
  harmonisers: [identity, center_scale, quantile_ref, fsqn, rank, combat_addon, combat_pooled]
  selectors:
    - {name: variance, k: 500}                      # TACO baseline (most variable genes)
    - {name: differential, k: 200}
    - {name: invariant, k: 200}
    - {name: prior, genes: priors/taco_411_dce_genes.txt, mode: prior_only}
    - {name: prior, genes: priors/taco_411_dce_genes.txt, mode: union, k: 200}
    - {name: prior, genes: priors/mrcontrol_32_genes.txt, mode: union, k: 200}
  classifiers: [logreg, rf, taco, cross_study]
  covariates: [age, sex, sample_matrix]
  protect: [age, sex, sample_matrix]
  nested_select_harmoniser: true
  min_test_per_class: 5
  n_boot: 1000
  random_state: 0
out: results/lc_transcriptomics_blood
