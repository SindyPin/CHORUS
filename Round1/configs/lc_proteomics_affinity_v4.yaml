# Version 4 cohort set (16 November 2026): configs/lc_proteomics_affinity.yaml plus Fineschi2026; leave one study out on the
# proteins shared by all four cohorts. Results of the three-cohort config are kept in results/lc_proteomics_affinity.
# CHORUS proteomics Test 1, affinity block: Long COVID versus COVID recovered from plasma or serum affinity proteomics
# (Olink and SomaScan), leave one study out on the proteins shared by all three cohorts (UniProt keys,
# docs/proteomics_cohorts.md). Cohort files are written by scripts/proteomics/build_all.py; curation decisions of
# 15 November 2026 are applied in the builders (docs/proteomics_cohorts.md, "Curation decisions").
# The three cohorts are pooled as one layer ("proteomics"): NPX (Olink Explore), log2 RFU (SomaScan) and the
# authors' Z scores (Su2022) are on different scales; results/README.md lists which harmonisers are meaningful for Su2022.
layer: proteomics
cohorts:
  - {study_id: Buggert2025,         matrix: data/proteomics/Buggert2025/Buggert2025_matrix.csv,                 meta: data/meta/Buggert2025_meta.csv,         feature_space: uniprot, accession: "doi:10.5281/zenodo.14772494"}
    # Gao 2025 (Nat Immunol). Olink Explore 3072 NPX, plasma; repeated runs of one sample across plates: the first in file order is kept.
  - {study_id: Cervia2024_SomaScan, matrix: data/proteomics/Cervia2024_SomaScan/Cervia2024_SomaScan_matrix.csv, meta: data/meta/Cervia2024_SomaScan_meta.csv, feature_space: uniprot, accession: "doi:10.17632/dvf6yvrg4x.1"}
    # Cervia-Hasler 2024 (Science). SomaScan 7k log2 RFU, serum; 6-month samples (the acute samples are dropped below).
  - {study_id: Su2022,              matrix: data/proteomics/Su2022/Su2022_matrix.csv,                           meta: data/meta/Su2022_meta.csv,              feature_space: uniprot, accession: "doi:10.17632/96v329bg7g.1"}
    # Su 2022 (Cell) INCOV. Olink Explore 1536 as the authors' batch corrected Z scores (not NPX), plasma; T3 (post acute) samples.
  - {study_id: Fineschi2026,        matrix: data/proteomics/Fineschi2026/Fineschi2026_matrix.csv,               meta: data/meta/Fineschi2026_meta.csv,        feature_space: uniprot, accession: "doi:10.17044/scilifelab.31316779"}
    # Fineschi 2026 (Front Immunol), Uppsala. Olink Explore 384 Inflammation NPX, plasma; 92 WHO post COVID-19 condition / 73 infected
    # controls without persistent symptoms, one sample each. Added 16 November 2026 (version 4 cohort set).
preprocessing:
  matrices: [plasma, serum]
  drop_sample_phases: [acute]               # acute draws carry the later outcome in lc_status; Test 1 uses post acute samples only
  keep_lc_status: [LC, COVID_recovered]
  one_sample_per_subject: true
  acute_timepoints: []                      # acute samples are already dropped by sample_phase
  timepoint_order: [T1, T2, T3]
  deduplicate: true
  impute: study_median                      # Olink values masked at QC (Buggert2025, 1.3% of values); per cohort, label free
benchmark:
  positive: LC
  negative: COVID_recovered
  harmonisers: [identity, center_scale, rank, fsqn, combat_addon, chorus]
  selectors:
    - {name: variance, k: 100}
    - {name: differential, k: 50}
    - {name: invariant, k: 50}
  classifiers: [logreg, rf]
  covariates: []
  nested_select_harmoniser: true
  min_test_per_class: 5
  n_boot: 1000
  random_state: 0
out: results/lc_proteomics_affinity_v4
