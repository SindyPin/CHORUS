# Sensitivity run (16 November 2026): configs/lc_transcriptomics_blood_v4.yaml without the three GSE224615 samples flagged at
# salmon QC (GSM7027478, GSM7027490, GSM7027501; mapping rate more than 2.5 MAD below the cohort median, docs/provenance.md).
# Everything else, including the expression filter applied after the exclusion, as in that config.
# Version 4 cohort set (16 November 2026): configs/lc_transcriptomics_blood.yaml plus PRJNA1149196_SA, PRJNA1149196_QLD
# (Sinclair 2024 whole blood, salmon on the first 5,000,000 read pairs per run against the GSE224615 index) and GSE297499
# (Orlinick 2026 PBMC, author TPM). Everything else as in that config; its results are kept in results/lc_transcriptomics_blood.
# Builders: scripts/build_rna_cohorts_2026_11.py; definitions in docs/count_matrices.md ("Cohorts added 16 November 2026").
# CHORUS primary benchmark: Long COVID versus COVID recovered from blood bulk RNA-seq, pooled across public cohorts.
# Cohort list revised 9 November 2026 against docs/data_inventory.csv (NCBI, ENA, PRIDE queries). The earlier list from the
# collaborator catalogue contained errors: GSE275334 is a NanoString PBMC panel (15 LC / 18 healthy / 14 ME/CFS), not whole
# blood RNA-seq with paired Olink, and is removed. Whole blood alone is now too thin for leave one study out, so the primary
# analysis pools whole blood and PBMC with sample_matrix as a covariate; matrix restricted runs are sensitivity analyses.
# Matrices point at the files on disk described in docs/count_matrices.md (sample ids are the matrix column ids).
# provenance: author_matrix = GEO supplementary integer counts; author_estimated_counts = GEO supplementary estimated
# (fractional) counts, rounded to integers by the loader; author_normalised = genuinely normalised author values (is_counts
# false; the loader applies log2(x + 1) when the maximum exceeds 50; none at present); requantify = Salmon from ENA reads
# (docs/provenance.md). enabled: false keeps a cohort in the record without loading it (missing matrix, metadata or labels).
layer: bulk_rna
cohorts:
  # ---- LC versus COVID recovered labels available (primary contrast) ----
  - {study_id: GSE226260_WB,  matrix: data/counts/GSE226260/GSE226260_wholeblood_counts.csv.gz, meta: data/meta/GSE226260_WB_meta.csv,  is_counts: true, provenance: author_matrix, accession: GSE226260}
    # Aid 2025 (Nat Immunol). Whole blood subset: 52 PASC / 51 Recovered, windows 3-6, 6-12, >12 months; labels in GEO (current long_covid_status). Anchor cohort.
  - {study_id: GSE226260_PBMC, matrix: data/counts/GSE226260/GSE226260_PBMC_counts.csv.gz,     meta: data/meta/GSE226260_PBMC_meta.csv, is_counts: true, provenance: author_matrix, accession: GSE226260}
    # Aid 2025 PBMC subset: 72 PASC / 14 NOPASC; labels in GEO (pasc status). Same participants may appear in the WB subset, but the subsets use different subject ids (numeric vs BIxxxx), so overlap cannot be resolved from GEO.
    # Sample s049 (title p22179-s049_601096-14-Dec-2020) carried the malformed tail of the combined file; check it before trusting it.
  - {study_id: GSE224615,     matrix: data/quant/GSE224615/salmon.merged.gene_counts.tsv, meta: data/meta/GSE224615_meta.csv, is_counts: true, provenance: requantify, accession: GSE224615,
     exclude_samples: [GSM7027478, GSM7027490, GSM7027501]}
    # Yin 2024 (LIINC). PBMC, 8 months, 23 LC / 13 non-LC in GEO; no count matrix, so the 36 ENA runs were re-quantified with salmon against GENCODE v47
    # (docs/provenance.md). QC flags GSM7027478, GSM7027490 and GSM7027501 (mapping rate more than 2.5 MAD below the cohort median); they are excluded
    # in this sensitivity config (exclude_samples).
  - {study_id: GSE251849,     matrix: data/counts/GSE251849/GSE251849_Counts.txt.gz,      meta: data/meta/GSE251849_meta.csv,     is_counts: true, provenance: author_estimated_counts, accession: GSE251849}
    # Greene 2024. PBMC, 11 LC (6 + 5 brain fog) / 5 convalescent / 7 healthy. Small; held out only in the pooled analysis. Author values are estimated (fractional) counts, rounded by the loader.
  - {study_id: GSE215865,     matrix: data/counts/GSE215865/GSE215865_rnaseq_raw_count_matrix.csv.gz, meta: data/meta/GSE215865_meta.csv, is_counts: true, provenance: author_matrix, accession: GSE215865, enabled: false}
    # Disabled here: acute samples do not belong in the post acute pool. Used as the test set of configs/lc_acute_transfer.yaml.
    # Thompson 2023 (Mount Sinai). Whole blood, acute hospitalised, 1,392 libraries longitudinal; LC labels from the Synapse clinical table already used in TACO
    # (SindyPin/TACO Data/411_DCEG_Paths_average.csv: Subject_ID, Long_COVID). Use one sample per subject (first sample) for pooling; keep the full set for the acute transfer experiment.
    # Labels (scripts/build_cohort_meta.py): Long_COVID 1 + COVID positive = LC (302 subjects), 0 + positive = COVID_recovered (122), 0 + negative = never_infected (64);
    # one subject with Long_COVID 1 but COVID negative (Subj_e53e70d3) is excluded, and 19 subjects missing from the TACO table are unknown.
  - {study_id: GSE270045,     matrix: data/counts/GSE270045/GSE270045_counts_ensembl.tsv.gz, meta: data/meta/GSE270045_meta.csv, is_counts: true, provenance: author_estimated_counts, accession: GSE270045}
    # Shahbaz 2025 (PMID 41205594). Whole blood, 19 LC (post COVID ME/CFS, at least 12 months) / 17 controls. GEO calls the controls healthy, but the paper
    # states they recovered from COVID-19 without symptoms, so the negative class is COVID_recovered. GEO has 19 LC where the paper reports 18 (ask the lead contact).
    # Author matrix holds estimated (fractional) counts keyed by gene symbol, rounded by the loader; mapped to Ensembl with scripts/map_symbols_to_ensembl.py (28,872 of 28,889 symbols).
    # Labels and ids verified (docs/gse270045_check.md), but group is confounded with sample collection (LC all S0xx_11, controls CCI/HP) and its
    # LC genes run opposite to the training cohorts. Reported together with a sensitivity run excluding it
    # (results/lc_transcriptomics_blood_noGSE270045).
  # ---- added 16 November 2026 (version 4 cohort set) ----
  - {study_id: PRJNA1149196_SA,  matrix: data/quant/PRJNA1149196/PRJNA1149196_SA_gene_counts.tsv.gz,  meta: data/meta/PRJNA1149196_SA_meta.csv,  is_counts: true, provenance: requantify, accession: PRJNA1149196}
    # Sinclair 2024 cohort 1 (South Australia). Whole blood, total RNA (rRNA and globin depleted), DNBSEQ-T7; PASC and PASC-CVS (LC) and
    # Recovered at about 44 and 68 weeks (the 44 week sample is kept), 15 uninfected controls (never_infected, not in this contrast).
    # Same participants as GSE169687 (disabled); salmon on the first 5,000,000 read pairs of each run.
  - {study_id: PRJNA1149196_QLD, matrix: data/quant/PRJNA1149196/PRJNA1149196_QLD_gene_counts.tsv.gz, meta: data/meta/PRJNA1149196_QLD_meta.csv, is_counts: true, provenance: requantify, accession: PRJNA1149196}
    # Sinclair 2024 cohort 2 (Queensland). Whole blood, total RNA (Ribo-Zero plus), NovaSeq 6000; 5 PASC-CVS / 4 Recovered at about one
    # year. Fewer than 5 recovered samples, so it is never held out (min_test_per_class) and only trains. Salmon on all reads: its FASTQ files are
    # sorted by alignment position, so a read prefix holds only chr1 and chr10 (data/quant/PRJNA1149196_QLD_full, docs/provenance.md).
  - {study_id: GSE297499,        matrix: data/counts/GSE297499/GSE297499_pbmc_tpm_ensembl.tsv.gz,        meta: data/meta/GSE297499_meta.csv,        is_counts: false, provenance: author_normalised, accession: GSE297499}
    # Orlinick 2026 (Yale). PBMC of women, 17 neuropsychiatric LC / 9 infected without persistent symptoms. Author TPM mapped from symbols
    # to Ensembl; the loader applies log2(x + 1). The CSF samples of the series are not used.
  # ---- LC versus COVID recovered labels exist but are not in GEO: obtain before inclusion ----
  - {study_id: GSE267625,     matrix: data/counts/GSE267625/GSE267625_P4O2_COVID_blood_transcriptome.csv.gz, meta: data/meta/GSE267625_meta.csv, is_counts: true, provenance: author_estimated_counts, accession: GSE267625, enabled: false}
    # Blankestijn 2024 (P4O2). Whole blood, 111 libraries (79 at 3 months, 32 at 12 months). LC / recovered labels via the paper supplement or p4o2@amsterdamumc.nl.
    # Author values are estimated (fractional) counts, rounded by the loader, with column ids <subject>_<index>; GSM mapping is positional (docs/count_matrices.md).
  - {study_id: PRJNA1184005,  matrix: data/quant/PRJNA1184005/salmon.merged.gene_counts.tsv, meta: data/meta/PRJNA1184005_meta.csv, is_counts: true, provenance: requantify, accession: PRJNA1184005, train_only: true, enabled: false}
    # Missailidis 2024. PBMC, 7 LC / 7 recovered. Neither the BioSample attributes nor the paper carry per sample labels (by age only vacSG34, vacSG102 and
    # vacSG112 must be recovered); request the key from S. Annesley. Training only (never held out) until labels arrive; also needs re-quantification.
  - {study_id: GSE222253,     matrix: data/counts/GSE222253/GSE222253_merged_counts.csv.gz, meta: data/meta/GSE222253_meta.csv, is_counts: true, provenance: author_matrix, accession: GSE222253, enabled: false}
    # BQC19 (PMID 37680625). Whole blood, 24 hospitalised patients, with versus without post COVID symptoms; symptom labels from the paper or BQC19. Hospitalised only.
  - {study_id: GSE169687,     matrix: data/counts/GSE169687/GSE169687_merged_counts.csv.gz, meta: data/meta/GSE169687_meta.csv, is_counts: true, provenance: author_matrix, accession: GSE169687, enabled: false}
    # Ryan 2022 (PMID 35027067). Whole blood, 69 convalescents at 12/16/24 weeks after infection plus 14 seronegative controls never infected (never_infected).
    # LC is defined in the paper as referral to the SA Health long COVID clinic (21 of 69): LC = referred, COVID_recovered = not referred (48). The per subject
    # referral flag is not in GEO or the open supplements; to be requested from D. Lynn (SAHMRI). Disabled until the flag arrives.
  # Removed: GSE275334 (NanoString PBMC panel, no RNA-seq, no recovered controls, no Olink). GSE286325 (scRNA, raw reads not public) kept aside for a pseudobulk sensitivity analysis.
preprocessing:
  matrices: [whole_blood, PBMC]   # primary analysis pools both; rerun with [whole_blood] and with [PBMC] as sensitivity analyses
  min_cpm: 1.0
  min_fraction_samples: 0.5
  one_sample_per_subject: true    # earliest post acute sample per subject (days_since_infection, then timepoint); timepoint Acute dropped (GSE226260 WB)
  deduplicate: true
benchmark:
  positive: LC
  negative: COVID_recovered        # secondary run: negative: never_infected (GSE251849 and GSE169687 controls)
  harmonisers: [identity, center_scale, quantile_ref, fsqn, rank, combat_addon, combat_pooled, chorus, chorus_protected]
  nested_candidates: [identity, center_scale, quantile_ref, fsqn, rank, combat_addon, combat_pooled, chorus]   # chorus_protected is a comparison variant, not a nested candidate
  selectors:
    - {name: variance, k: 500}                      # TACO baseline (most variable genes)
    - {name: differential, k: 200}
    - {name: invariant, k: 200}
    - {name: prior, genes: priors/taco_411_dce_genes.txt, mode: prior_only}
    - {name: prior, genes: priors/taco_411_dce_genes.txt, mode: union, k: 200}
    - {name: prior, genes: priors/mrcontrol_32_genes.txt, mode: union, k: 200}
  classifiers: [logreg, rf, taco, cross_study]
  covariates: [sample_matrix]     # age and sex are recorded only for GSE226260_PBMC (data/meta/curation_notes.md)
  protect: [sample_matrix]
  nested_select_harmoniser: true
  min_test_per_class: 5
  n_boot: 1000
  random_state: 0
out: results/lc_transcriptomics_blood_v4_noQCflag
